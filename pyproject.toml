[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "engineai-speech"
version = "0.1.0"
description = "EngineAI speech library for microphone dialog, audio front-end, and provider adapters."
readme = "README.md"
license = { file = "LICENSE.txt" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "sounddevice>=0.5",
    "websockets>=12",
]

[project.optional-dependencies]
rag = ["jieba>=0.42", "rank-bm25>=0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
engineai_speech = ["knowledge/stopwords.txt"]
