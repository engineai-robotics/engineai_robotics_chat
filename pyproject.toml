[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "engineai-robotics-chat"
version = "0.1.0"
description = "EngineAI robotics chat library for microphone dialogue, audio capture, and speech providers."
readme = "README.md"
license = { file = "LICENSE.txt" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "sounddevice>=0.5",
    "websockets>=12",
]

[project.optional-dependencies]
rag = ["jieba>=0.42", "rank-bm25>=0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
engineai_robotics_chat = ["knowledge/stopwords.txt"]
